            {question:"What is physical database design phase?",options:["Implement schema in DBMS; choose indexes, storage structures, partitioning strategies","Create ER diagrams","Normalize data","Write queries"],correctAnswer:"Implement schema in DBMS; choose indexes, storage structures, partitioning strategies",explanation:"Physical phase: create actual tables, define indexes, set constraints, optimize for performance."},
            {question:"What JOIN returns only matching rows from both tables?",options:["INNER JOIN","LEFT JOIN","RIGHT JOIN","FULL OUTER JOIN"],correctAnswer:"INNER JOIN",explanation:"INNER JOIN returns only rows where join condition matches in both tables."},
            {question:"What JOIN returns all rows from left table plus matching from right?",options:["LEFT JOIN (or LEFT OUTER JOIN)","INNER JOIN","RIGHT JOIN","CROSS JOIN"],correctAnswer:"LEFT JOIN (or LEFT OUTER JOIN)",explanation:"LEFT JOIN returns all left table rows and matching right table rows; NULLs for no match."},
            {question:"What JOIN returns all rows from right table plus matching from left?",options:["RIGHT JOIN (or RIGHT OUTER JOIN)","INNER JOIN","LEFT JOIN","CROSS JOIN"],correctAnswer:"RIGHT JOIN (or RIGHT OUTER JOIN)",explanation:"RIGHT JOIN returns all right table rows and matching left table rows; NULLs for no match."},
            {question:"What JOIN returns all rows from both tables?",options:["FULL OUTER JOIN","INNER JOIN","LEFT JOIN","CROSS JOIN"],correctAnswer:"FULL OUTER JOIN",explanation:"FULL OUTER JOIN returns all rows from both tables with NULLs where no match."},
            {question:"What JOIN returns Cartesian product (every row from left with every row from right)?",options:["CROSS JOIN","INNER JOIN","OUTER JOIN","SELF JOIN"],correctAnswer:"CROSS JOIN",explanation:"CROSS JOIN produces Cartesian product. If left has 3 rows and right has 4, result has 12 rows."},
            {question:"What SELF JOIN does?",options:["Joins table to itself using different aliases for same table","Joins two different tables","Combines rows from multiple tables","Filters duplicate rows"],correctAnswer:"Joins table to itself using different aliases for same table",explanation:"SELF JOIN: table joined with itself. Example: find employees and their managers from Employee table."},
            {question:"What is EQUIJOIN?",options:["JOIN using equality (=) operator in join condition","JOIN with unequal conditions","JOIN removing duplicates","JOIN combining multiple tables"],correctAnswer:"JOIN using equality (=) operator in join condition",explanation:"Equijoin uses = operator. Example: ON orders.customer_id = customers.id."},
            {question:"What is NON-EQUIJOIN?",options:["JOIN using operators other than = (>, <, >=, <=, <>)","JOIN with equality operator","Multiple table join","Subquery join"],correctAnswer:"JOIN using operators other than = (>, <, >=, <=, <>)",explanation:"Non-equijoin uses operators like <, >, <=, >=. Example: salary between 30000 and 50000."},
            {question:"What is NATURAL JOIN?",options:["JOIN on columns with same name without explicit ON; assumes matching names","Manual join definition","Outer join type","Index-based join"],correctAnswer:"JOIN on columns with same name without explicit ON; assumes matching names",explanation:"NATURAL JOIN automatically joins on columns with same name. Risky if naming inconsistent."},
            {question:"What is USING clause in JOIN?",options:["Shorthand for ON clause when both tables have same column name","Lists which columns to select","Filters join results","Sorts joined data"],correctAnswer:"Shorthand for ON clause when both tables have same column name",explanation:"USING (customer_id) is shorthand for ON orders.customer_id = customers.customer_id."},
            {question:"What is subquery?",options:["Query nested inside another query that returns data for outer query","Query that sorts results","Query combining tables","Query with WHERE clause"],correctAnswer:"Query nested inside another query that returns data for outer query",explanation:"Subquery executes first, returns results to outer query. Can be in SELECT, FROM, or WHERE."},
            {question:"What is correlated subquery?",options:["Subquery that references columns from outer query, executes repeatedly for each outer row","Regular subquery in SELECT","Subquery in FROM clause","Subquery with no reference"],correctAnswer:"Subquery that references columns from outer query, executes repeatedly for each outer row",explanation:"Correlated subquery references outer query. Slower since it repeats for each outer row."},
            {question:"What does NOT EXISTS do?",options:["Returns TRUE if subquery returns no rows, FALSE if rows exist","Reverses join result","Deletes records","Renames columns"],correctAnswer:"Returns TRUE if subquery returns no rows, FALSE if rows exist",explanation:"NOT EXISTS returns TRUE when subquery has no matching rows. Used to find missing relationships."},
            {question:"What is data redundancy problem?",options:["Same data stored multiple times causing inconsistency and wasted storage","Using backup copies","Sorting data repeatedly","Column duplication"],correctAnswer:"Same data stored multiple times causing inconsistency and wasted storage",explanation:"Redundancy: duplication causes update anomalies. Normalization eliminates redundancy."},
            {question:"What prevents orphaned records?",options:["Referential integrity constraint (foreign key constraint)","Primary key","Unique constraint","Check constraint"],correctAnswer:"Referential integrity constraint (foreign key constraint)",explanation:"Referential integrity ensures if parent deleted, either children deleted or prevent parent deletion."},
            {question:"What is domain integrity?",options:["Ensures data type, format, and valid range constraints are enforced","All tables related","All data unique","All queries optimized"],correctAnswer:"Ensures data type, format, and valid range constraints are enforced",explanation:"Domain integrity: correct data type, valid values (CHECK), NOT NULL, DEFAULT constraints."},
            {question:"What is entity integrity?",options:["Ensures every row uniquely identifiable (PRIMARY KEY not NULL)","All tables linked","All data consistent","All values valid"],correctAnswer:"Ensures every row uniquely identifiable (PRIMARY KEY not NULL)",explanation:"Entity integrity: PRIMARY KEY prevents NULL and duplicates, uniquely identifies each row."},
            {question:"What normalization reduces?",options:["Data redundancy, insertion/update/deletion anomalies, improves integrity","Query speed only","Storage size only","Number of tables"],correctAnswer:"Data redundancy, insertion/update/deletion anomalies, improves integrity",explanation:"Normalization reduces redundancy and anomalies, improves data integrity and consistency."},
            {question:"What is denormalization?",options:["Intentional introduction of redundancy for query performance by combining normalized tables","Process of normalization","Removing foreign keys","Deleting duplicate data"],correctAnswer:"Intentional introduction of redundancy for query performance by combining normalized tables",explanation:"Denormalization: add redundancy for speed. Trade-off: faster queries but harder updates."},
            {question:"What is dimensional modeling?",options:["Database design for data warehouses with fact tables and dimension tables","Normalization for OLTP","ER modeling","Physical database design"],correctAnswer:"Database design for data warehouses with fact tables and dimension tables",explanation:"Dimensional modeling: fact tables (measures) and dimension tables (descriptive data) for analytics."},
            {question:"What is a fact table?",options:["Contains measurable facts and foreign keys to dimension tables; stores transactional data","Stores reference data","Stores operational data","Stores metadata"],correctAnswer:"Contains measurable facts and foreign keys to dimension tables; stores transactional data",explanation:"Fact table: contains numeric measures (sales amount, quantity) and foreign keys to dimensions."},
            {question:"What is a dimension table?",options:["Contains descriptive attributes providing context to fact table measures","Contains transactions","Contains keys only","Contains only dates"],correctAnswer:"Contains descriptive attributes providing context to fact table measures",explanation:"Dimension table: stores attributes like product name, category, customer region for analysis."},
            {question:"What is slowly changing dimension?",options:["Dimension data that changes over time; tracks historical changes with versioning","Dimension rarely accessed","Static dimension data","Dimension without updates"],correctAnswer:"Dimension data that changes over time; tracks historical changes with versioning",explanation:"Slowly changing dimensions: track history (Type 1: overwrite, Type 2: new row, Type 3: new column)."},
            {question:"What is surrogate key?",options:["Artificial identifier not from business data, often auto-increment integer for performance","Natural business key","Foreign key","Composite key"],correctAnswer:"Artificial identifier not from business data, often auto-increment integer for performance",explanation:"Surrogate key: system-generated ID (1,2,3...) independent of business data. Improves performance."},
            {question:"What is natural key?",options:["Key from actual business data that has business meaning; example: SSN or ISBN","Artificial identifier","Primary key only","Foreign key"],correctAnswer:"Key from actual business data that has business meaning; example: SSN or ISBN",explanation:"Natural key: from actual data with business meaning. Problem: can change (SSN, ISBN stable)."},
            {question:"What is primary key difference from candidate key?",options:["PRIMARY KEY chosen from candidate keys; only one PRIMARY KEY per table","No difference","Candidate key is unique constraint","Primary key foreign reference"],correctAnswer:"PRIMARY KEY chosen from candidate keys; only one PRIMARY KEY per table",explanation:"Candidate keys: attributes that can uniquely identify row. PRIMARY KEY: chosen candidate key."},
            {question:"What is alternate key?",options:["Candidate key not chosen as primary key; still unique but not primary","Foreign key","Composite key","Index key"],correctAnswer:"Candidate key not chosen as primary key; still unique but not primary",explanation:"Alternate key: other candidate keys you could use instead of chosen PRIMARY KEY."},
            {question:"What is unique key?",options:["Constraint allowing one NULL but no duplicates; similar to PRIMARY but allows NULL","Same as PRIMARY KEY","Foreign key constraint","Check constraint"],correctAnswer:"Constraint allowing one NULL but no duplicates; similar to PRIMARY but allows NULL",explanation:"UNIQUE constraint: no duplicates, allows one NULL, multiple per table (vs PRIMARY KEY)."},
            {question:"What is foreign key?",options:["Column/columns referencing primary key of another table establishing relationship","Imported key from another database","Temporary key","External identifier"],correctAnswer:"Column/columns referencing primary key of another table establishing relationship",explanation:"FOREIGN KEY maintains referential integrity. Values must exist as PRIMARY KEY in referenced table."},
            {question:"What is CHECK constraint?",options:["Validates data meets condition; example: age > 0 AND age < 150","Checks for NULL values","Checks for duplicates","Validates data type"],correctAnswer:"Validates data meets condition; example: age > 0 AND age < 150",explanation:"CHECK constraint: enforces business rule. Example: salary >= 0, gender IN ('M','F')."},
            {question:"What is DEFAULT constraint?",options:["Assigns default value if none provided; example: status DEFAULT 'active'","Requires value","Prevents NULL","Ensures uniqueness"],correctAnswer:"Assigns default value if none provided; example: status DEFAULT 'active'",explanation:"DEFAULT: if INSERT omits column, uses default. Example: created_date DEFAULT CURRENT_DATE."},
            {question:"What is NOT NULL constraint?",options:["Column must have value, NULL not allowed","Allows empty strings","Allows zero values","Allows NULL"],correctAnswer:"Column must have value, NULL not allowed",explanation:"NOT NULL constraint: column must contain value. Used for essential data."},
            {question:"What is data type INT in MySQL?",options:["4-byte integer ranging -2,147,483,648 to 2,147,483,647","1 byte integer","8 byte integer","Text type"],correctAnswer:"4-byte integer ranging -2,147,483,648 to 2,147,483,647",explanation:"INT: 4 bytes, range ±2.1 billion. Use TINYINT (1 byte), SMALLINT (2), BIGINT (8) for different ranges."},
            {question:"What is data type DECIMAL in MySQL?",options:["Fixed-point decimal for exact currency/financial calculations; DECIMAL(5,2) = 999.99","Floating point for approximate values","Exact count of items","Date type"],correctAnswer:"Fixed-point decimal for exact currency/financial calculations; DECIMAL(5,2) = 999.99",explanation:"DECIMAL(p,s): p=total digits, s=decimal places. DECIMAL(5,2)=3 integer+2 decimal. For money."},
            {question:"What is data type VARCHAR in MySQL?",options:["Variable-length text up to specified max; VARCHAR(100) stores up to 100 chars with row limits","Fixed 100 characters always","Single character","Character set type"],correctAnswer:"Variable-length text up to specified max; VARCHAR(100) stores up to 100 chars with row limits",explanation:"VARCHAR(n): variable length 0 to n chars. Saves space vs CHAR. Shares 65,535-byte row limit."},
            {question:"What is data type CHAR in MySQL?",options:["Fixed-length text; CHAR(10) always 10 chars, padded with spaces if shorter","Variable length text","Character code","Unicode type"],correctAnswer:"Fixed-length text; CHAR(10) always 10 chars, padded with spaces if shorter",explanation:"CHAR(n): fixed length padded with spaces. Faster than VARCHAR but wastes space for short values."},
            {question:"What is data type DATE in MySQL?",options:["Stores date in YYYY-MM-DD format; range 1000-01-01 to 9999-12-31","Stores date and time","Text representation of date","Numeric date code"],correctAnswer:"Stores date in YYYY-MM-DD format; range 1000-01-01 to 9999-12-31",explanation:"DATE: date only. Use DATETIME or TIMESTAMP for date and time. Use TIME for time only."},
            {question:"What is data type BOOLEAN in MySQL?",options:["Stored as TINYINT(1); TRUE=1, FALSE=0","True/false text type","Bit type","Integer type"],correctAnswer:"Stored as TINYINT(1); TRUE=1, FALSE=0",explanation:"BOOLEAN: MySQL converts to TINYINT(1). TRUE→1, FALSE→0. Works with boolean literals."},
            {question:"What is data type ENUM in MySQL?",options:["String column restricted to enumerated list of values; ENUM('small','medium','large')","Text allowing any value","Fixed number of characters","Date enumeration"],correctAnswer:"String column restricted to enumerated list of values; ENUM('small','medium','large')",explanation:"ENUM: column restricted to list of predefined values. Efficient storage but alter table for new values."},
            {question:"What is data type TEXT in MySQL?",options:["Large variable-length text; up to 4GB without specified size","Fixed-length text","Small text limited to 255","Unicode text only"],correctAnswer:"Large variable-length text; up to 4GB without specified size",explanation:"TEXT: TINYTEXT (255), TEXT (64K), MEDIUMTEXT (16M), LONGTEXT (4G). For large text."},
            {question:"What is data type BLOB in MySQL?",options:["Binary Large Object; stores binary data like images, videos, files","Text blob","Large text type","Binary counter"],correctAnswer:"Binary Large Object; stores binary data like images, videos, files",explanation:"BLOB: binary data. TINYBLOB, BLOB, MEDIUMBLOB, LONGBLOB. Use for images, PDFs, etc."},
            {question:"What does ON DELETE CASCADE do?",options:["Automatically deletes child records when parent record deleted","Prevents parent deletion if children exist","Backs up child records","Copies child records"],correctAnswer:"Automatically deletes child records when parent record deleted",explanation:"ON DELETE CASCADE: enforces referential integrity by cascading deletes. Use carefully!"},
            {question:"What does ON DELETE RESTRICT do?",options:["Prevents parent record deletion if child records exist; raises error","Allows deletion","Deletes parent only","Copies records"],correctAnswer:"Prevents parent record deletion if child records exist; raises error",explanation:"ON DELETE RESTRICT: parent cannot delete while children exist. Forces cleanup first."},
            {question:"What does ON DELETE SET NULL do?",options:["Sets foreign key to NULL when parent deleted; only if column allows NULL","Deletes child","Prevents deletion","Copies child"],correctAnswer:"Sets foreign key to NULL when parent deleted; only if column allows NULL",explanation:"ON DELETE SET NULL: child.parent_id becomes NULL when parent deleted. Only works if FK nullable."},
            {question:"What does ON UPDATE CASCADE do?",options:["Updates all child foreign key values when parent primary key updated","Updates parent only","Prevents update","Copies values"],correctAnswer:"Updates all child foreign key values when parent primary key updated",explanation:"ON UPDATE CASCADE: if parent key changes, all child keys automatically updated (rare since PKs fixed)."},
            {question:"What is VIEW in database?",options:["Virtual table based on query; stored SELECT statement without storing physical data","Physical table","Index structure","Query result","Database file"],correctAnswer:"Virtual table based on query; stored SELECT statement without storing physical data",explanation:"VIEW: saved query appears as table. Can be updated (simple views), used for security/simplicity."},
            {question:"Can you insert into VIEW?",options:["Yes, if based on single table with PRIMARY KEY; restricted views only","Yes, always","No, never","Only with special permissions"],correctAnswer:"Yes, if based on single table with PRIMARY KEY; restricted views only",explanation:"Simple views (single table with PK) can have INSERT/UPDATE/DELETE. Complex views read-only."},
            {question:"What is materialized VIEW?",options:["View with data physically stored and refreshed periodically from source tables","Regular view stored in memory","Indexed view","Cached query result"],correctAnswer:"View with data physically stored and refreshed periodically from source tables",explanation:"Materialized view: stores actual data updated on schedule. Faster reads, slower updates."},
            {question:"What is CURSOR in SQL?",options:["Pointer to result set allowing row-by-row processing; used in stored procedures","Result set column indicator","Database pointer","Row counter"],correctAnswer:"Pointer to result set allowing row-by-row processing; used in stored procedures",explanation:"CURSOR: iterates through rows. OPEN cursor, FETCH INTO variables, CLOSE cursor."},
            {question:"What is trigger?",options:["Automatic action (stored procedure) executed in response to INSERT/UPDATE/DELETE events","Scheduled task","User action","Index rebuild"],correctAnswer:"Automatic action (stored procedure) executed in response to INSERT/UPDATE/DELETE events",explanation:"TRIGGER: automatically runs code before/after INSERT/UPDATE/DELETE. Enforces rules, maintains audit logs."},
            {question:"What is stored procedure?",options:["Compiled SQL code stored in database accepting parameters and returning results","SQL query in application","Index definition","View definition"],correctAnswer:"Compiled SQL code stored in database accepting parameters and returning results",explanation:"Stored procedure: pre-compiled code executed from application/trigger. CALL procedure_name(args)."},
            {question:"What is function vs stored procedure?",options:["Function returns single value, procedure performs actions; function used in queries","No difference","Procedure is faster","Function stores data"],correctAnswer:"Function returns single value, procedure performs actions; function used in queries",explanation:"Function: returns scalar/table value, used in SELECT. Procedure: performs actions, called with CALL."},
            {question:"What is BEGIN/START TRANSACTION?",options:["Starts explicit transaction grouping multiple statements as atomic unit","Starts new SQL session","Begins database connection","Initializes variables"],correctAnswer:"Starts explicit transaction grouping multiple statements as atomic unit",explanation:"BEGIN or START TRANSACTION: marks transaction start. Followed by COMMIT or ROLLBACK."},
            {question:"What is SAVEPOINT?",options:["Marker within transaction allowing partial ROLLBACK to that point, not full rollback","Start of transaction","End of transaction","Backup point"],correctAnswer:"Marker within transaction allowing partial ROLLBACK to that point, not full rollback",explanation:"SAVEPOINT: creates revertible point. ROLLBACK TO SAVEPOINT reverts to that point only."},
            {question:"What is deadlock in database?",options:["Two transactions waiting for each other to release locks; both blocked indefinitely","Locked transaction","Failed update","Missing index"],correctAnswer:"Two transactions waiting for each other to release locks; both blocked indefinitely",explanation:"Deadlock: Transaction A locks X and waits for Y, Transaction B locks Y and waits for X. System detects, rolls back."},
            {question:"What is data warehouse?",options:["Large database optimized for complex analysis and reporting of historical data","Operational database for transactions","Index repository","Backup storage"],correctAnswer:"Large database optimized for complex analysis and reporting of historical data",explanation:"Data warehouse: stores historical data from multiple sources for OLAP (analysis) vs OLTP (transactions)."},
            {question:"What is OLTP?",options:["Online Transaction Processing - operational database optimized for rapid INSERT/UPDATE/DELETE","Analytical processing","Offline database","Legacy system"],correctAnswer:"Online Transaction Processing - operational database optimized for rapid INSERT/UPDATE/DELETE",explanation:"OLTP: production system. Many transactions, real-time. Normalized structure, small data."},
            {question:"What is OLAP?",options:["Online Analytical Processing - data warehouse optimized for complex analysis, reporting, aggregations","Transaction system","Backup process","Data cleaning"],correctAnswer:"Online Analytical Processing - data warehouse optimized for complex analysis, reporting, aggregations",explanation:"OLAP: analysis system. Complex queries, historical data. Denormalized, large data (star schema)."},
            {question:"What is ETL process?",options:["Extract-Transform-Load: extract from source, transform to format, load to warehouse","Edit-Track-Log process","Error-Test-Launch process","Export-Transfer-List process"],correctAnswer:"Extract-Transform-Load: extract from source, transform to format, load to warehouse",explanation:"ETL: data pipeline. Extract source data, transform (clean, aggregate), load to warehouse."},
            {question:"What is data quality issue?",options:["Inaccurate, incomplete, inconsistent, or stale data affecting analysis","Missing columns","Wrong data type","Performance problem"],correctAnswer:"Inaccurate, incomplete, inconsistent, or stale data affecting analysis",explanation:"Data quality: accuracy, completeness, consistency, timeliness. Addressed in ETL validation."},
            {question:"What is master data?",options:["Core reference data used across organization; customer, product, employee maintained centrally","Temporary data","Transaction data","Archive data"],correctAnswer:"Core reference data used across organization; customer, product, employee maintained centrally",explanation:"Master data: single source of truth. Customers, products, employees. Critical for consistency."},
            {question:"What is metadata?",options:["Data about data - describes structure, meaning, usage of data in system","User data","System logs","Configuration files"],correctAnswer:"Data about data - describes structure, meaning, usage of data in system",explanation:"Metadata: table schemas, column descriptions, data types, constraints. Data dictionary."},
            {question:"What is schema in database?",options:["Overall structure of database - collection of tables, relationships, constraints, indexes","Single table definition","User account","Database name"],correctAnswer:"Overall structure of database - collection of tables, relationships, constraints, indexes",explanation:"Schema: complete database design including all tables, columns, keys, constraints."},
            {question:"What is sharding/partitioning?",options:["Dividing large table into smaller parts horizontally (sharding) or vertically (partitioning) for performance","Backing up data","Compressing data","Encrypting data"],correctAnswer:"Dividing large table into smaller parts horizontally (sharding) or vertically (partitioning) for performance",explanation:"Sharding: split by range (horizontal). Partitioning: split by value. Improves query speed on huge tables."},
            {question:"What is replication in database?",options:["Creating copies of database on multiple servers for redundancy and read distribution","Backup creation","Data duplication","Query optimization"],correctAnswer:"Creating copies of database on multiple servers for redundancy and read distribution",explanation:"Replication: master-slave or multi-master. Provides failover and read scaling."},
            {question:"What is backup and recovery?",options:["Backup: copy database regularly; Recovery: restore from backup if failure occurs","Delete old data","Archive history","Performance tuning"],correctAnswer:"Backup: copy database regularly; Recovery: restore from backup if failure occurs",explanation:"Backup strategies: full (entire DB), incremental (changes), differential (changes since last full)."},
            {question:"What is log-based recovery?",options:["Uses transaction log to redo/undo committed/uncommitted changes for crash recovery","Backup method","Storage format","Compression technique"],correctAnswer:"Uses transaction log to redo/undo committed/uncommitted changes for crash recovery",explanation:"Write-ahead logging: write to log before data. On crash, use log to recover committed changes."},
            {question:"What is cloud database?",options:["Database managed and hosted by cloud provider; accessed over internet with auto-scaling","Database on local server only","Backup in cloud storage only","Virtual machine database"],correctAnswer:"Database managed and hosted by cloud provider; accessed over internet with auto-scaling",explanation:"Cloud DB: AWS RDS, Azure SQL, Google Cloud SQL. Benefits: scalability, maintenance-free, pay-per-use."},
            {question:"What is NoSQL database?",options:["Non-relational database; document, key-value, graph stores without strict schema","Any non-SQL database","Old database system","Negative SQL database"],correctAnswer:"Non-relational database; document, key-value, graph stores without strict schema",explanation:"NoSQL: MongoDB (document), Redis (key-value), Neo4j (graph). No SQL, flexible schema, horizontal scaling."},
            {question:"What is MongoDB?",options:["Document-based NoSQL database storing JSON-like documents in collections","Relational database","Graph database","Key-value store"],correctAnswer:"Document-based NoSQL database storing JSON-like documents in collections",explanation:"MongoDB: stores BSON (JSON-like) documents. Flexible schema, good for semi-structured data."},
            {question:"What is graph database?",options:["Database optimized for storing and querying relationships; nodes and edges","Document database","Time-series database","Relational database"],correctAnswer:"Database optimized for storing and querying relationships; nodes and edges",explanation:"Graph DB: Neo4j. Stores nodes (entities) and relationships (edges). Fast for complex relationship queries."},
            {question:"What is key-value database?",options:["Simple database storing key-value pairs for fast retrieval; Redis, Memcached","Document database","Relational database","Graph database"],correctAnswer:"Simple database storing key-value pairs for fast retrieval; Redis, Memcached",explanation:"Key-value: Redis, Memcached. Ultra-fast lookups. Used for caching, sessions, real-time data."},
            {question:"What is time-series database?",options:["Database optimized for time-stamped data like stock prices, sensor readings, metrics","Temporal database","Historical database","Archive database"],correctAnswer:"Database optimized for time-stamped data like stock prices, sensor readings, metrics",explanation:"Time-series DB: InfluxDB, TimescaleDB. Optimized for timestamps. Good for monitoring, IoT."},
            {question:"What is search index?",options:["Full-text search optimized database like Elasticsearch for fast text searching","Database index","Regular index","Sorted index"],correctAnswer:"Full-text search optimized database like Elasticsearch for fast text searching",explanation:"Elasticsearch: inverted index for full-text search. Fast text queries. Often used with logging/analytics."},
            {question:"What is API in database context?",options:["Application Programming Interface allowing applications to communicate with database programmatically","Personal interface","Administrative panel","User login"],correctAnswer:"Application Programming Interface allowing applications to communicate with database programmatically",explanation:"Database API: REST API, GraphQL, JDBC, ODBC. Allows applications to query database remotely."},
            {question:"What is ORM framework?",options:["Object-Relational Mapping mapping object-oriented code to relational database; Hibernate, SQLAlchemy","Operating system interface","Reporting module","Optimization rule"],correctAnswer:"Object-Relational Mapping mapping object-oriented code to relational database; Hibernate, SQLAlchemy",explanation:"ORM: maps objects to database tables automatically. No manual SQL writing. Hibernate (Java), SQLAlchemy (Python)."},
            {question:"What is SQL injection attack?",options:["Security vulnerability where attacker injects malicious SQL code into input; prevented by parameterized queries","SQL syntax error","Database corruption","Server failure"],correctAnswer:"Security vulnerability where attacker injects malicious SQL code into input; prevented by parameterized queries",explanation:"SQL injection: malicious SQL in input. Prevention: parameterized queries, input validation, escaping."},
            {question:"What is parameterized query?",options:["Query with placeholders for values executed with parameters; prevents SQL injection","Query with hardcoded values","Dynamic SQL query","Compiled query"],correctAnswer:"Query with placeholders for values executed with parameters; prevents SQL injection",explanation:"Parameterized query: SELECT * FROM users WHERE id = ? executes with id parameter. Safe from injection."},
            {question:"What is encryption for database?",options:["Converting sensitive data to unreadable form using algorithms; Transparent Data Encryption (TDE)","Data compression","Data backup","Data sorting"],correctAnswer:"Converting sensitive data to unreadable form using algorithms; Transparent Data Encryption (TDE)",explanation:"Encryption: TDE encrypts database. Column-level encryption for specific sensitive columns."},
            {question:"What is role-based access control (RBAC)?",options:["Restricting data access based on user roles; admin, user, guest with specific permissions","User login","Password protection","Firewall rules"],correctAnswer:"Restricting data access based on user roles; admin, user, guest with specific permissions",explanation:"RBAC: roles have permissions. User assigned to role inherits permissions. Granular access control."},
            {question:"What is audit logging?",options:["Recording who accessed/modified data and when for security and compliance","Error logging","Performance logging","Debug logging"],correctAnswer:"Recording who accessed/modified data and when for security and compliance",explanation:"Audit log: tracks INSERT/UPDATE/DELETE by user. Required for regulatory compliance (HIPAA, GDPR)."},
            {question:"What is consistency in ACID?",options:["Database transitions from one valid state to another; all rules and constraints respected","Data completeness","Data accuracy","Data availability"],correctAnswer:"Database transitions from one valid state to another; all rules and constraints respected",explanation:"Consistency: all constraints, rules, triggers maintained. Database always valid after transaction."},
            {question:"What is isolation in ACID?",options:["Concurrent transactions don't interfere; reads not affected by uncommitted changes in other transactions","Data protection","Data access control","System separation"],correctAnswer:"Concurrent transactions don't interfere; reads not affected by uncommitted changes in other transactions",explanation:"Isolation: concurrent transactions isolated. Read committed/repeatable read/serializable levels."},
            {question:"What is durability in ACID?",options:["Committed changes survive system failures; permanently stored even if crash occurs","Data backup","Data retention","Long-term storage"],correctAnswer:"Committed changes survive system failures; permanently stored even if crash occurs",explanation:"Durability: changes written to non-volatile storage. Survives power loss, hardware failure."},
            {question:"What transaction isolation level is most restrictive?",options:["Serializable - complete isolation; slowest but safest","Repeatable read","Read committed","Read uncommitted"],correctAnswer:"Serializable - complete isolation; slowest but safest",explanation:"Serializable: transactions cannot interfere. Most restrictive, prevents all anomalies but slower."},
            {question:"What transaction isolation level is least restrictive?",options:["Read uncommitted - dirty reads allowed; fastest but unsafe","Read committed","Repeatable read","Serializable"],correctAnswer:"Read uncommitted - dirty reads allowed; fastest but unsafe",explanation:"Read uncommitted: allows dirty reads (uncommitted data). Fastest, least safe. Rarely used."},
            {question:"What is dirty read?",options:["Reading uncommitted data from another transaction that might be rolled back","Reading old data","Reading duplicate data","Reading NULL values"],correctAnswer:"Reading uncommitted data from another transaction that might be rolled back",explanation:"Dirty read: transaction reads data not yet committed. If other transaction rolls back, data invalid."},
            {question:"What is non-repeatable read?",options:["Reading same row twice shows different values because another transaction modified it between reads","Multiple reads same value","Unchanged data read twice","NULL read"],correctAnswer:"Reading same row twice shows different values because another transaction modified it between reads",explanation:"Non-repeatable read: SELECT same row twice, different values between reads due to UPDATE."},
            {question:"What is phantom read?",options:["Querying same range twice returns different rows because another transaction inserted/deleted rows","Duplicate rows","Missing rows","Empty result"],correctAnswer:"Querying same range twice returns different rows because another transaction inserted/deleted rows",explanation:"Phantom read: SELECT WHERE age>30 returns 5 rows, rerun returns 6 rows (INSERT occurred)."},
            {question:"What is query optimization?",options:["Improving query performance through execution plans, indexes, statistics, rewriting","Query rewriting only","Adding indexes only","Database tuning"],correctAnswer:"Improving query performance through execution plans, indexes, statistics, rewriting",explanation:"Query optimization: execution plan analysis, add indexes, update statistics, rewrite queries."},
            {question:"What is query execution plan?",options:["Step-by-step breakdown how database engine executes query; shows operations, order, cost","Query syntax tree","SQL statement","Index list"],correctAnswer:"Step-by-step breakdown how database engine executes query; shows operations, order, cost",explanation:"Execution plan: shows table scan vs index scan, JOIN order, cost. Use EXPLAIN to view."},
            {question:"What is table scan vs index scan?",options:["Table scan: reads all rows sequentially; Index scan: uses index for faster access to specific rows","Opposite operations","Random vs ordered access","Full vs partial read"],correctAnswer:"Table scan: reads all rows sequentially; Index scan: uses index for faster access to specific rows",explanation:"Table scan: O(n) slow for large tables. Index scan: O(log n) fast for specific values."},
            {question:"What is database statistics?",options:["Metadata about data distribution (row count, distinct values) used by optimizer for better plans","Performance metrics","User statistics","System logs"],correctAnswer:"Metadata about data distribution (row count, distinct values) used by optimizer for better plans",explanation:"Statistics: analyze table, gather distribution info. Optimizer uses for best execution plan."},
            {question:"What is connection pooling?",options:["Reusing database connections from pool instead of creating new one per request; improves performance","Connection optimization","Network pooling","Memory pooling"],correctAnswer:"Reusing database connections from pool instead of creating new one per request; improves performance",explanation:"Connection pool: maintains open connections, reuses them. Reduces overhead, faster responses."},
            {question:"What is prepared statement?",options:["Pre-compiled SQL statement executed multiple times with different parameters; faster and safer","Compiled code","Stored procedure","Trigger definition"],correctAnswer:"Pre-compiled SQL statement executed multiple times with different parameters; faster and safer",explanation:"Prepared statement: parse once, execute many times. Faster for repeated queries, prevents SQL injection."},
            {question:"What is batch processing in database?",options:["Executing multiple SQL statements as batch for efficiency; INSERT/UPDATE multiple rows at once","Single statement execution","Real-time processing","Sequential execution"],correctAnswer:"Executing multiple SQL statements as batch for efficiency; INSERT/UPDATE multiple rows at once",explanation:"Batch processing: bulk INSERT/UPDATE/DELETE. Faster than individual statements."},
            {question:"What is CAP theorem?",options:["Consistency, Availability, Partition tolerance - can guarantee only two; tradeoff theory","Database constraint","SQL principle","Normalization rule"],correctAnswer:"Consistency, Availability, Partition tolerance - can guarantee only two; tradeoff theory",explanation:"CAP: Consistency (all see same data), Availability (always responsive), Partition tolerance (works despite splits)."},
            {question:"What is BASE model?",options:["Basically Available, Soft state, Eventually consistent - NoSQL alternative to ACID","Basic SQL expression","Backup access system","Binary algorithm"],correctAnswer:"Basically Available, Soft state, Eventually consistent - NoSQL alternative to ACID",explanation:"BASE: relaxes consistency for availability. Eventually consistent. Used in distributed systems."},
            {question:"What is distributed database?",options:["Database spread across multiple locations/servers; data replicated for reliability and performance","Centralized database","Large database","Remote database"],correctAnswer:"Database spread across multiple locations/servers; data replicated for reliability and performance",explanation:"Distributed DB: data split/replicated across servers. Challenges: consistency, network latency."},
            {question:"What is eventual consistency?",options:["Distributed system becomes consistent after some time; temporary inconsistencies allowed","Immediate consistency","No consistency guarantee","Weak consistency"],correctAnswer:"Distributed system becomes consistent after some time; temporary inconsistencies allowed",explanation:"Eventual consistency: distributed system eventually consistent but temporarily inconsistent. Used in NoSQL."},
            {question:"What is vector clock?",options:["Mechanism tracking causality in distributed systems without central clock; ensures ordering","System clock","Timer mechanism","Sequential numbering"],correctAnswer:"Mechanism tracking causality in distributed systems without central clock; ensures ordering",explanation:"Vector clock: (node_id, counter) tracks event ordering in distributed DB without synchronized clocks."},
            {question:"What is query cache?",options:["In-memory storage of query results reused for identical queries; improves response time","Query optimization","Index cache","Buffer pool"],correctAnswer:"In-memory storage of query results reused for identical queries; improves response time",explanation:"Query cache: stores identical query results. Invalidated when table changes. Found in MySQL."},
            {question:"What is buffer pool in database?",options:["In-memory cache of pages from disk; reduces disk I/O for frequently accessed data","Database backup","Temporary storage","Cache memory"],correctAnswer:"In-memory cache of pages from disk; reduces disk I/O for frequently accessed data",explanation:"Buffer pool: in-memory cache. Larger pool = fewer disk reads. Critical for performance."},
            {question:"What is write-ahead logging (WAL)?",options:["Writing changes to log before writing to data files; ensures durability in crash recovery","Read-ahead logging","Buffer writing","Delayed writing"],correctAnswer:"Writing changes to log before writing to data files; ensures durability in crash recovery",explanation:"WAL: log written first, then data. Ensures committed changes survive crashes."},
            {question:"What is MVCC?",options:["Multi-Version Concurrency Control - each transaction sees consistent snapshot; supports concurrent reads/writes","Multi-view concurrency","Master version control","Mutex-based concurrency"],correctAnswer:"Multi-Version Concurrency Control - each transaction sees consistent snapshot; supports concurrent reads/writes",explanation:"MVCC: multiple versions of rows. Readers don't block writers. Used in PostgreSQL, MySQL InnoDB."},
            {question:"What is ACID transactions guarantee?",options:["Atomicity (all/nothing), Consistency (valid), Isolation (no interference), Durability (permanent)","Accuracy and durability only","Consistency and availability","All operations atomic"],correctAnswer:"Atomicity (all/nothing), Consistency (valid), Isolation (no interference), Durability (permanent)",explanation:"ACID: four properties ensuring reliable transactions. All four must be satisfied."},
            {question:"What is column-oriented database?",options:["Database storing data by column instead of row; optimized for analytical queries; Parquet, ORC","Row-oriented database","Relational database","File-based database"],correctAnswer:"Database storing data by column instead of row; optimized for analytical queries; Parquet, ORC",explanation:"Column DB: stores columns separately. Better compression, faster analytics. Row DB faster for OLTP."},
            {question:"What is data governance?",options:["Policies and processes managing data quality, security, compliance, and lifecycle; ensures accountability","Data management","Data storage","Data backup"],correctAnswer:"Policies and processes managing data quality, security, compliance, and lifecycle; ensures accountability",explanation:"Data governance: defines who accesses data, how it's used, quality standards, retention policies."},
            {question:"What is database migration?",options:["Moving data from one database system to another or one version to newer version; requires careful planning","Backing up database","Copying database","Merging databases"],correctAnswer:"Moving data from one database system to another or one version to newer version; requires careful planning",explanation:"Migration: moving to new system/version. Challenges: downtime, data integrity, rollback plan."},
            {question:"What is the difference between DROP and TRUNCATE?",options:["DROP is DDL that removes structure/data; TRUNCATE is DDL that removes data only but keeps structure","DROP removes data while TRUNCATE removes structure","TRUNCATE is slower than DROP","DROP can be rolled back but TRUNCATE cannot"],correctAnswer:"DROP is DDL that removes structure/data; TRUNCATE is DDL that removes data only but keeps structure",explanation:"DROP: removes table structure and data; is DDL. TRUNCATE: removes all data but keeps structure; is DDL. DELETE: removes data with conditions; is DML and can be rolled back."},
            {question:"What is a correlated subquery?",options:["Subquery that references outer query columns and executes once per outer row","Subquery in SELECT clause only","Subquery that joins multiple tables","Subquery with no reference to outer query"],correctAnswer:"Subquery that references outer query columns and executes once per outer row",explanation:"Correlated subquery references outer query. Executes repeatedly for each outer row. Slower than joins but useful for row-by-row comparisons."},
            {question:"What does DISTINCT keyword do?",options:["Returns only unique/different values removing duplicates","Sorts values alphabetically","Groups values together","Counts occurrences"],correctAnswer:"Returns only unique/different values removing duplicates",explanation:"SELECT DISTINCT removes duplicate rows from result set. Only returns unique values."},
            {question:"What is a view in database?",options:["Virtual table based on query; stored SELECT without storing physical data","Physical table stored on disk","Copy of table for backup","Query result file"],correctAnswer:"Virtual table based on query; stored SELECT without storing physical data",explanation:"VIEW: a saved SQL query that appears as a table. No physical data stored. Used for security, simplification, and data abstraction."},
            {question:"What is Boyce-Codd Normal Form (BCNF)?",options:["Stricter than 3NF; every determinant must be a candidate key","Same as 3NF for most cases","Removes all NULL values","Eliminates all foreign keys"],correctAnswer:"Stricter than 3NF; every determinant must be a candidate key",explanation:"BCNF is stricter than 3NF. Every attribute determining another must be a candidate key. Eliminates anomalies that 3NF misses."},
            {question:"What is a subquery?",options:["Query within another query returning data to outer query","Query sorting results","Query combining tables","Single SELECT statement"],correctAnswer:"Query within another query returning data to outer query",explanation:"Subquery (inner query): executes first, returns results used by outer query. Can be in SELECT, FROM, WHERE, or HAVING."},
            {question:"What does GROUP BY do?",options:["Groups rows by column values to use with aggregate functions","Orders results by column","Removes duplicate rows","Filters rows with conditions"],correctAnswer:"Groups rows by column values to use with aggregate functions",explanation:"GROUP BY groups rows sharing same column value. Used with COUNT, SUM, AVG, etc. HAVING filters groups after grouping."},
            {question:"What is referential integrity constraint?",options:["Ensures foreign key values exist as primary key values in referenced table","Ensures all values are unique","Ensures no NULL values exist","Ensures data is sorted correctly"],correctAnswer:"Ensures foreign key values exist as primary key values in referenced table",explanation:"Referential integrity: prevents orphaned records. Foreign key values must match or be NULL. Enforced by PRIMARY KEY/FOREIGN KEY constraints."},
            {question:"What is database ACID compliance?",options:["Atomicity, Consistency, Isolation, and Durability ensure reliable transactions","Automatic, Consistent, Indexed Database","Atomic Cluster Integrity Database","All Columns In Databases"],correctAnswer:"Atomicity, Consistency, Isolation, and Durability ensure reliable transactions",explanation:"ACID: transactions are all-or-nothing (atomicity), maintain valid state (consistency), don't interfere (isolation), survive crashes (durability)."},
            {question:"What is an index in database?",options:["Data structure speeding up data retrieval by creating quick lookups based on column values","File storing backup data","Record of all database changes","Table of query results"],correctAnswer:"Data structure speeding up data retrieval by creating quick lookups based on column values",explanation:"Index: creates sorted structure for faster searching. Primary key automatically indexed. Can create additional indexes for frequently searched columns."}

        let flashcards = [
            {term:"SELECT",definition:"SQL statement used to retrieve data from one or more tables. Syntax: SELECT columns FROM table WHERE condition;"},
            {term:"INSERT",definition:"SQL statement used to insert new records into a table. Syntax: INSERT INTO table (columns) VALUES (values);"},
            {term:"UPDATE",definition:"SQL statement used to modify existing records. Syntax: UPDATE table SET column = value WHERE condition;"},
            {term:"DELETE",definition:"SQL statement used to remove records from a table. Syntax: DELETE FROM table WHERE condition;"},
            {term:"WHERE",definition:"Clause that filters records based on specified conditions. Used in SELECT, UPDATE, and DELETE statements."},
            {term:"ORDER BY",definition:"Clause that sorts result set in ascending (ASC) or descending (DESC) order. Can use multiple columns."},
            {term:"GROUP BY",definition:"Clause that groups rows with same values in specified columns, often used with aggregate functions."},
            {term:"HAVING",definition:"Clause that filters groups created by GROUP BY. Works on aggregated data, unlike WHERE which works on rows."},
            {term:"JOIN",definition:"Clause that combines rows from two or more tables based on related columns. Types: INNER, LEFT, RIGHT, CROSS."},
            {term:"INNER JOIN",definition:"Returns only rows where there is a match in both tables. Excludes non-matching rows from both tables."},
            {term:"LEFT JOIN",definition:"Returns all rows from the left table and matching rows from the right table. Fills NULL for unmatched right rows."},
            {term:"RIGHT JOIN",definition:"Returns all rows from the right table and matching rows from the left table. Fills NULL for unmatched left rows."},
            {term:"CROSS JOIN",definition:"Returns the Cartesian product of two tables, combining each row from first table with each row from second table."},
            {term:"SELF JOIN",definition:"Joins a table to itself, useful for comparing rows within the same table. Requires table aliases."},
            {term:"UNION",definition:"Combines results from multiple SELECT statements, removing duplicate rows. All SELECTs must have same number of columns."},
            {term:"UNION ALL",definition:"Combines results from multiple SELECT statements, keeping all rows including duplicates. Faster than UNION."},
            {term:"COUNT()",definition:"Aggregate function that returns the number of rows matching a condition. COUNT(*) counts all rows."},
            {term:"SUM()",definition:"Aggregate function that returns the total sum of values in a numeric column. Ignores NULL values."},
            {term:"AVG()",definition:"Aggregate function that returns the average (mean) of values in a numeric column. Ignores NULL values."},
            {term:"MIN()",definition:"Aggregate function that returns the smallest value in a column. Works with numeric, date, and text columns."},
            {term:"MAX()",definition:"Aggregate function that returns the largest value in a column. Works with numeric, date, and text columns."},
            {term:"DISTINCT",definition:"Keyword that removes duplicate rows from result set. Syntax: SELECT DISTINCT column FROM table;"},
            {term:"LIKE",definition:"Operator used to search for patterns in text. Uses wildcards: % (zero or more chars) and _ (single char)."},
            {term:"IN",definition:"Operator that allows specifying multiple values in WHERE clause. Syntax: WHERE column IN (value1, value2, value3);"},
            {term:"BETWEEN",definition:"Operator that selects values within a specified range, inclusive of endpoints. Syntax: WHERE column BETWEEN value1 AND value2;"},
            {term:"IS NULL",definition:"Operator used to check if a column contains NULL (unknown) values. Cannot use = NULL."},
            {term:"IS NOT NULL",definition:"Operator used to check if a column does NOT contain NULL values."},
            {term:"COALESCE()",definition:"Function that returns the first non-NULL value from a list of arguments. Useful for handling NULL values."},
            {term:"IFNULL()",definition:"MySQL function that returns a specified value if an expression is NULL, otherwise returns the expression."},
            {term:"PRIMARY KEY",definition:"Constraint that uniquely identifies each record in a table. Cannot contain NULL values. Only one per table."},
            {term:"FOREIGN KEY",definition:"Constraint that links to the PRIMARY KEY of another table. Establishes relationships and enforces referential integrity."},
            {term:"UNIQUE",definition:"Constraint that ensures all values in a column are unique. Multiple UNIQUE constraints allowed; allows NULL."},
            {term:"NOT NULL",definition:"Constraint that ensures a column must always contain a value. No empty cells allowed."},
            {term:"DEFAULT",definition:"Constraint that provides a default value for a column if no value is specified during INSERT."},
            {term:"CHECK",definition:"Constraint that limits values in a column based on specified condition. Example: age INT CHECK (age >= 18);"},
            {term:"CREATE TABLE",definition:"DDL statement that creates a new table with specified columns and constraints."},
            {term:"ALTER TABLE",definition:"DDL statement that modifies table structure. Can ADD, MODIFY, or DROP columns and constraints."},
            {term:"DROP TABLE",definition:"DDL statement that deletes an entire table including structure and all data. Cannot be easily undone."},
            {term:"TRUNCATE",definition:"DDL statement that quickly deletes all rows from a table but keeps structure. Faster than DELETE, no WHERE clause."},
            {term:"VIEW",definition:"Virtual table based on SELECT query result. Doesn't store data but displays result set. Useful for simplifying queries."},
            {term:"INDEX",definition:"Database object that speeds up data retrieval. Creates sorted copy of columns for faster searches."},
            {term:"INT",definition:"Data type for storing integer numbers. Range: -2,147,483,648 to 2,147,483,647 (SIGNED)."},
            {term:"VARCHAR",definition:"Data type for variable-length text strings. Uses only needed space. Syntax: VARCHAR(max_length)."},
            {term:"CHAR",definition:"Data type for fixed-length text strings. Pads with spaces to reach specified length. Less efficient than VARCHAR."},
            {term:"DECIMAL",definition:"Data type for precise decimal numbers, ideal for monetary values. Syntax: DECIMAL(precision, scale)."},
            {term:"DATE",definition:"Data type for storing dates in YYYY-MM-DD format. Useful for date calculations and filtering."},
            {term:"BOOLEAN",definition:"Data type for true/false values. Often stored as TINYINT(1) in MySQL where 1=TRUE, 0=FALSE."},
            {term:"NULL",definition:"Represents missing or unknown value in a column. Different from empty string or zero. Requires IS NULL to check."},
            {term:"Normalization",definition:"Process of organizing data to reduce redundancy and improve integrity through normal forms (1NF, 2NF, 3NF, BCNF)."},
            {term:"1NF",definition:"First Normal Form - requires all values be atomic (indivisible). Eliminates repeating groups."},
            {term:"2NF",definition:"Second Normal Form - requires 1NF plus all non-key attributes depend on entire primary key."},
            {term:"3NF",definition:"Third Normal Form - requires 2NF plus non-key attributes depend only on primary key."},
            {term:"BCNF",definition:"Boyce-Codd Normal Form - stricter than 3NF where every determinant must be a candidate key."},
            {term:"Entity",definition:"A distinct object or thing that can be uniquely identified and stored in a database table."},

            {term:"Relationship",definition:"An association or connection between entities, typically represented through foreign keys."},
            {term:"Cardinality",definition:"Describes the number of records: one-to-one (1:1), one-to-many (1:N), or many-to-many (M:N)."},
            {term:"One-to-Many",definition:"One parent record can have multiple child records, but each child belongs to only one parent."},
            {term:"Many-to-Many",definition:"Multiple records from one entity relate to multiple records from another. Requires junction table."},
            {term:"Strong Entity",definition:"Entity that exists independently with its own primary key. Not dependent on other entities."},
            {term:"Weak Entity",definition:"Entity that depends on another (strong) entity for existence and identification."},
            {term:"Candidate Key",definition:"Attribute or attributes that can uniquely identify each row. Primary key chosen from candidate keys."},
            {term:"Composite Key",definition:"Primary key made up of two or more columns. All columns together uniquely identify each row."},
            {term:"Referential Integrity",definition:"Constraint ensuring foreign key values match primary key values in referenced table. Prevents orphaned records."},
            {term:"DDL",definition:"Data Definition Language - SQL commands that manage database structure: CREATE, ALTER, DROP, TRUNCATE."},
            {term:"DML",definition:"Data Manipulation Language - SQL commands that manage data: SELECT, INSERT, UPDATE, DELETE."},
            {term:"Atomic Value",definition:"An indivisible value that cannot be broken down further. Requirement for 1NF."},
            {term:"Partial Dependency",definition:"When a non-key attribute depends on only part of a composite primary key. Violates 2NF."},
            {term:"Transitive Dependency",definition:"When non-key attribute depends on another non-key attribute rather than primary key. Violates 3NF."}

        function initializeFlashcards() {
            displayFlashcards(flashcards);
            document.getElementById('cardCount').textContent = flashcards.length;
        }

        function displayQuestion() {
            if (!shuffledQuestions || shuffledQuestions.length === 0) return;
            
            const question = shuffledQuestions[currentQuestionIndex];
            const answered = answers[currentQuestionIndex] !== null;
            
            // Use stored randomized options for this question
            let options = randomizedOptions[currentQuestionIndex];
            if (!options) {
                // First time showing this question - randomize and store
                options = [...question.options].sort(() => Math.random() - 0.5);
                randomizedOptions[currentQuestionIndex] = options;
            }
            
            let html = `
                <div class="question-container ${answered ? 'answered' : ''}">
                    <div class="question-number">Question ${currentQuestionIndex + 1} of ${shuffledQuestions.length}</div>
                    <div class="question-text">${question.question}</div>
                    <div class="options">
            `;

            options.forEach((option, idx) => {
                const isSelected = answers[currentQuestionIndex] === option;
                const isCorrect = option === question.correctAnswer;
                
                let classes = 'option';
                if (isSelected) classes += ' selected';
                if (answered && isCorrect) classes += ' correct';
                if (answered && isSelected && !isCorrect) classes += ' incorrect';

                let onchangeAttr = answered ? 'disabled' : `onchange="selectAnswer('${option.replace(/'/g, "\\'")}')"`;
                html += `
                    <label class="${classes}">
                        <input type="radio" name="answer" 
                            ${isSelected ? 'checked' : ''} 
                            ${onchangeAttr}
                        >
                        <span class="option-label">${option}</span>
                    </label>
                `;
            });

            html += `</div>`;

            if (answered) {
                const isCorrect = answers[currentQuestionIndex] === question.correctAnswer;
                html += `
                    <div class="feedback ${isCorrect ? 'correct' : 'incorrect'}">
                        <div class="feedback-label">${isCorrect ? '✓ Correct!' : '✗ Incorrect'}</div>
                        ${!isCorrect ? `<strong>Correct Answer:</strong> ${question.correctAnswer}<br><br>` : ''}
                        <strong>Explanation:</strong> ${question.explanation}
                    </div>
                `;
            }

            html += `
                <div class="button-group">
                    <button class="btn-secondary" onclick="previousQuestion()" ${currentQuestionIndex === 0 ? 'disabled' : ''}>← Previous</button>
                    <button class="btn-primary" onclick="nextQuestion()" ${!answered ? 'disabled' : ''}>${currentQuestionIndex === shuffledQuestions.length - 1 ? 'Finish' : 'Next'} →</button>
                </div>
            </div>
            `;

            document.getElementById('testContent').innerHTML = html;
            updateProgress();
        }

        function selectAnswer(selectedOption) {
            answers[currentQuestionIndex] = selectedOption;
            displayQuestion();
        }

        function nextQuestion() {
            if (currentQuestionIndex < shuffledQuestions.length - 1) {
                currentQuestionIndex++;
                displayQuestion();
            } else {
                finishTest();
            }
        }

        function previousQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                displayQuestion();
            }
        }

        function updateProgress() {
            const progress = ((currentQuestionIndex + 1) / shuffledQuestions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('currentQuestion').textContent = currentQuestionIndex + 1;

            const correct = answers.filter((a, i) => a !== null && a === shuffledQuestions[i].correctAnswer).length;
            const wrong = answers.filter((a, i) => a !== null && a !== shuffledQuestions[i].correctAnswer).length;
            document.getElementById('correctCount').textContent = correct;
            document.getElementById('wrongCount').textContent = wrong;
        }

        function finishTest() {
            const correct = answers.filter((a, i) => a !== null && a === shuffledQuestions[i].correctAnswer).length;
            const percentage = Math.round((correct / shuffledQuestions.length) * 100);

            document.getElementById('testContent').style.display = 'none';
            document.getElementById('resultsContainer').classList.add('show');
            document.getElementById('finalScore').textContent = percentage + '%';
            document.getElementById('finalCorrect').textContent = correct;
        }

        function restartTest() {
            currentQuestionIndex = 0;
            document.getElementById('testContent').style.display = 'block';
            document.getElementById('resultsContainer').classList.remove('show');
            initializeTest();
        }

        function displayFlashcards(cardsToDisplay) {
            let html = '';
            cardsToDisplay.forEach((card) => {
                html += `
                    <div class="flashcard" onclick="toggleFlip(this)">
                        <div class="flashcard-inner">
                            <div class="flashcard-front">
                                <div class="card-label">Front</div>
                                ${card.term}
                            </div>
                            <div class="flashcard-back">
                                <div class="card-label">Back</div>
                                ${card.definition}
                            </div>
                        </div>
                    </div>
                `;
            });

            if (cardsToDisplay.length === 0) {
                html = '<div class="no-cards">No flashcards match your search.</div>';
            }

            document.getElementById('flashcardGrid').innerHTML = html;
        }

        function toggleFlip(element) {
            element.classList.toggle('flipped');
        }

        function filterFlashcards() {
            const searchTerm = document.getElementById('searchBox').value.toLowerCase();
            const filtered = flashcards.filter(card => 
                card.term.toLowerCase().includes(searchTerm) || 
                card.definition.toLowerCase().includes(searchTerm)
            );
            displayFlashcards(filtered);
            document.getElementById('cardCount').textContent = filtered.length;
        }

        function resetFlashcards() {
            document.getElementById('searchBox').value = '';
            document.querySelectorAll('.flashcard').forEach(card => {
                card.classList.remove('flipped');
            });
            displayFlashcards(flashcards);
            document.getElementById('cardCount').textContent = flashcards.length;
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            initializeTest();
            initializeFlashcards();
        });
    </script>
</body>
</html>
